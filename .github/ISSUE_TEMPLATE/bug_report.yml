name: Bug Report
description: Create a report to help us reproduce and fix a bug in Recipe Catcher
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us troubleshoot.
  - type: dropdown
    id: component
    attributes:
      label: Area / Recipe Source
      description: What part of the app or source type is affected?
      options:
        - Instagram Link Capture
        - Recipe Website URL Capture
        - YouTube Link / Caption Capture
        - Photo / Screenshot / Carousel Scan (Claude Vision)
        - Manual Entry / Write Recipe
        - Recipe Viewer / Cooking Mode
        - Meal Planner & Today Screen
        - Inventory / Cooked Food / Grocery Scanner
        - Recipe Chat / Find with AI / Plan Suggester
        - Wear OS Companion (Watch List / Tile / Sync)
        - Backup & Restore
        - In-App Update Checker
        - Settings & API Key
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open '...'
        2. Tap on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: "e.g. Google Pixel 8 Pro, Samsung Galaxy S24"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 14 (API 34), Android 15 (API 35), Android 17 (API 37)"
    validations:
      required: true
  - type: input
    id: watch_model
    attributes:
      label: Watch Model & Wear OS Version (if applicable)
      placeholder: "e.g. Pixel Watch 2 (Wear OS 4 / Android 13)"
  - type: input
    id: app_version
    attributes:
      label: App Version
      placeholder: "e.g. v1.2.0 or git commit SHA"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Crash Output
      description: Paste any crash logs or logcat output (please sanitize personal data or private URLs).
      render: shell
