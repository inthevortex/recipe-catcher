name: Feature Request
description: Suggest an idea or enhancement for Recipe Catcher
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep in mind that Recipe Catcher is an **offline-first, single-user, personal** app. Cloud sync, accounts, and social networking are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or workflow limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: checkboxes
    id: terms
    attributes:
      label: Offline-First Alignment
      options:
        - label: This feature respects the offline-first, local-data, and privacy-focused design of Recipe Catcher.
          required: true
