<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Margherita Pizza - Italian Home Kitchen</title>
    <meta property="og:site_name" content="Italian Home Kitchen">
    <meta property="og:title" content="Classic Margherita Pizza">
    <meta property="og:image" content="https://example.com/og_pizza.jpg">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Recipe",
      "name": "Classic Margherita Pizza",
      "description": "Simple traditional Italian Margherita pizza with basil and fresh mozzarella.",
      "image": "https://example.com/pizza.jpg",
      "recipeYield": "4",
      "prepTime": "PT20M",
      "cookTime": "PT15M",
      "totalTime": "PT35M",
      "recipeCuisine": "Italian",
      "recipeIngredient": [
        "250g pizza dough",
        "100g San Marzano tomato sauce",
        "150g fresh mozzarella",
        "Fresh basil leaves",
        "1 tbsp extra virgin olive oil"
      ],
      "recipeInstructions": [
        {
          "@type": "HowToStep",
          "text": "Preheat oven to 250C with pizza stone inside."
        },
        {
          "@type": "HowToStep",
          "text": "Stretch the dough into a 12-inch circle."
        },
        {
          "@type": "HowToStep",
          "text": "Spread tomato sauce evenly over the base."
        },
        {
          "@type": "HowToStep",
          "text": "Top with sliced mozzarella and drizzle with olive oil."
        },
        {
          "@type": "HowToStep",
          "text": "Bake for 10-12 minutes until crust is browned and cheese is bubbling."
        }
      ]
    }
    </script>
</head>
<body>
    <h1>Classic Margherita Pizza</h1>
</body>
</html>
